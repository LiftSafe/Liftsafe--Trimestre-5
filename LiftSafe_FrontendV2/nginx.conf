# ========================
# LiftSafe — Configuración de Nginx para Frontend SPA
# ========================
# ¿Qué? Configuración de Nginx para servir la aplicación React como Single Page App (SPA).
# ¿Para qué? React Router maneja las rutas en el cliente (browser), no en el servidor.
# ¿Impacto? Con try_files $uri /index.html, cualquier ruta desconocida devuelve index.html.

server {
    # Puerto en que Nginx escucha las peticiones HTTP
    listen 80;
    server_name localhost;

    # Directorio raíz donde están los archivos estáticos compilados
    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip para reducir el tamaño de respuestas
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # ────────────────────────────
    # 🗂️ Ruta principal — SPA fallback
    # ────────────────────────────
    location / {
        # Intenta servir el archivo exacto ($uri), luego el directorio ($uri/),
        # y si ninguno existe, sirve index.html
        try_files $uri $uri/ /index.html;
    }

    # ────────────────────────────
    # 🔄 index.html — NUNCA cachear
    # ────────────────────────────
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # ────────────────────────────
    # 📦 Assets estáticos — cache agresivo con hash de contenido
    # ────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ────────────────────────────
    # 🚫 Seguridad — ocultar versión de Nginx
    # ────────────────────────────
    server_tokens off;
}
