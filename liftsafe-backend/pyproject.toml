[project]
name = "liftsafe-backend"
version = "0.1.0"
description = "Backend FastAPI para LiftSafe - Sistema de Gestión de Inspecciones de Ascensores"
authors = [
    { name = "LiftSafe Team", email = "team@liftsafe.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "sqlalchemy==2.0.52",
    "pymysql==1.2.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.15.0",
    "python-jose==3.5.0",
    "bcrypt==5.0.0",
    "python-multipart==0.0.32",
    "python-dotenv==1.2.3",
    "reportlab==4.2.0",
    "pillow==12.3.0",
    "fastapi-mail==1.6.8",
    "aiosmtplib==5.1.2",
    "email-validator==2.3.0",
    "passlib==1.7.4",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "pytest-mock==3.15.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest]
pythonpath = ["."]
testpaths = ["tests"]
# Cada "uv run pytest" mide la cobertura y falla si baja del umbral
addopts = ["--cov", "--cov-report=term-missing"]

[tool.coverage.run]
source = ["app"]
# Se mide la lógica de negocio. Los adaptadores de arranque (app/__init__.py)
# no tienen lógica; el acceso a la BD se prueba con integración (semana 6).
omit = ["app/__init__.py"]

[tool.coverage.report]
fail_under = 0  # se reemplaza por la línea base al final (Turno D)
