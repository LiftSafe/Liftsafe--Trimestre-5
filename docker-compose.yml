# ========================
# LiftSafe — Docker Compose
# ========================
# ¿Qué? Orquesta MySQL, backend FastAPI y frontend React.
# ¿Para qué? Levantar toda la aplicación con un solo comando.
# ¿Impacto? Entorno reproducible para todos los desarrolladores.

services:
  # ────────────────────────────
  # 🐘 MySQL 8.0 — Base de datos
  # ────────────────────────────
  db:
    # MariaDB 10.4 = el mismo motor de XAMPP con el que se exportó la base,
    # así el respaldo (triggers, collations) carga sin cambios.
    image: mariadb:10.4
    container_name: liftsafe-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: liftsafe_db
      MYSQL_USER: liftsafe_app
      MYSQL_PASSWORD: 123456

    # 3307 afuera para no chocar con el MySQL de XAMPP (3306) si está encendido.
    # Dentro de Docker el backend sigue usando db:3306.
    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      # Al crear el contenedor por PRIMERA vez se importa la base con sus datos.
      - ./docker/mysql:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 30

    networks:
      - liftsafe_network

  # ────────────────────────────
  # 🐍 Backend — FastAPI + Uvicorn
  # ────────────────────────────
  be:
    build:
      context: ./liftsafe-backend
      dockerfile: Dockerfile

    container_name: liftsafe-be
    restart: unless-stopped

    # Si existe liftsafe-backend/.env se usa (p. ej. para el correo); si no, no pasa nada.
    env_file:
      - path: ./liftsafe-backend/.env
        required: false

    # Estas variables mandan sobre el .env: dentro de Docker la base está en "db".
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: liftsafe_app
      DB_PASSWORD: "123456"
      DB_NAME: liftsafe_db

      # JWT
      SECRET_KEY: dev-secret-key-change-in-production-liftsafe-2026
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 480

      # Clave AES de MySQL: debe ser la misma con la que se cifró la base importada
      SECRET_KEY_MYSQL: LiftSafeSecretKey2026!

      # Correo ("Olvidé mi contraseña"). Valores de relleno para que el backend
      # arranque; pon los reales en liftsafe-backend/.env si lo necesitas.
      MAIL_USERNAME: ${MAIL_USERNAME:-sin-configurar@example.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-sin-configurar}
      MAIL_FROM: ${MAIL_FROM:-sin-configurar@example.com}

      # Enlaces "Ver foto" del PDF
      API_PUBLIC_URL: http://localhost:8000

    volumes:
      # Fotos e informes PDF quedan guardados aunque se reconstruya la imagen
      - be_uploads:/app/uploads
      - be_informes:/app/informes

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy

    networks:
      - liftsafe_network

  # ────────────────────────────
  # ⚛️ Frontend — React + Nginx
  # ────────────────────────────
  fe:
    build:
      context: ./LiftSafe_FrontendV2
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000

    container_name: liftsafe-fe
    restart: unless-stopped

    ports:
      - "3000:80"

    depends_on:
      - be

    networks:
      - liftsafe_network

# ────────────────────────────
# 🌐 Redes
# ────────────────────────────
networks:
  liftsafe_network:
    driver: bridge

# ────────────────────────────
# 📦 Volúmenes
# ────────────────────────────
volumes:
  mysql_data:
  be_uploads:
  be_informes:
